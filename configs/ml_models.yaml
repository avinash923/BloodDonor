# =============================================================
# ml_models.yaml
# Hyperparameter configurations and grid-search spaces for
# all four benchmark classifiers:
#   1. Logistic Regression (LR)
#   2. Random Forest (RF)
#   3. Support Vector Machine (SVM)
#   4. XGBoost (XGB)
#
# NOTE: These hyperparameters apply ONLY to the UCI Blood
# Transfusion dataset pilot behavioral study (Stream A).
# =============================================================

logistic_regression:
  # Default / baseline hyperparameters
  default:
    penalty: "l2"
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42
  # Grid-search space for cross-validated tuning
  grid_search:
    C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    penalty: ["l1", "l2"]
    solver: ["liblinear", "lbfgs"]
    class_weight: ["balanced", null]

random_forest:
  default:
    n_estimators: 200
    max_depth: null           # Grow fully by default
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "sqrt"
    class_weight: "balanced"
    oob_score: true           # Out-of-bag validation
    random_state: 42
    n_jobs: -1
  grid_search:
    n_estimators: [100, 200, 500]
    max_depth: [null, 5, 10, 20]
    min_samples_split: [2, 5, 10]
    max_features: ["sqrt", "log2"]
    class_weight: ["balanced", "balanced_subsample"]

svm:
  default:
    kernel: "rbf"
    C: 1.0
    gamma: "scale"
    probability: true         # Required for Platt scaling calibration
    class_weight: "balanced"
    random_state: 42
  grid_search:
    C: [0.1, 1.0, 10.0, 100.0]
    kernel: ["rbf", "linear"]
    gamma: ["scale", "auto", 0.001, 0.01, 0.1]
    class_weight: ["balanced", null]
  # Calibration method applied post-training
  calibration:
    method: "sigmoid"         # Platt scaling; or "isotonic" for larger datasets

xgboost:
  default:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    gamma: 0.0
    scale_pos_weight: 3.0     # Compensates for class imbalance (~24% positive rate)
    use_label_encoder: false
    eval_metric: "logloss"
    early_stopping_rounds: 30
    random_state: 42
    n_jobs: -1
  grid_search:
    n_estimators: [100, 300, 500]
    learning_rate: [0.01, 0.05, 0.1]
    max_depth: [3, 6, 9]
    subsample: [0.7, 0.8, 1.0]
    colsample_bytree: [0.7, 0.8, 1.0]
    scale_pos_weight: [1.0, 3.0, 5.0]

# ---------------------------------------------------------------
# Probability calibration applied uniformly to all models
# ---------------------------------------------------------------
calibration:
  apply: true
  cv: 5                       # Inner folds for CalibratedClassifierCV
  method: "sigmoid"           # "sigmoid" (Platt) or "isotonic"

# ---------------------------------------------------------------
# Evaluation metrics configuration
# ---------------------------------------------------------------
evaluation:
  primary_metric: "roc_auc"   # Used for model selection / grid search
  metrics:
    - "roc_auc"
    - "pr_auc"
    - "f1_binary"
    - "f1_macro"
    - "brier_score"
    - "accuracy"
